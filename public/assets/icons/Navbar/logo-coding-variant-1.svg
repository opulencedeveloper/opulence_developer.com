<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0E0E0C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2A2A28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E0E0C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Opening angle bracket -->
  <text 
    x="5" 
    y="45" 
    font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, monospace" 
    font-size="42" 
    font-weight="900" 
    fill="#0E0E0C"
    opacity="0.6"
  >
    &lt;
  </text>
  
  <!-- Main text: opulence -->
  <text 
    x="25" 
    y="45" 
    font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="42" 
    font-weight="900" 
    fill="url(#codeGradient)"
    letter-spacing="-0.02em"
  >
    opulence
  </text>
  
  <!-- Closing angle bracket and slash -->
  <text 
    x="220" 
    y="45" 
    font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, monospace" 
    font-size="42" 
    font-weight="900" 
    fill="#0E0E0C"
    opacity="0.6"
  >
    /&gt;
  </text>
  
  <!-- Opening curly brace -->
  <text 
    x="5" 
    y="85" 
    font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, monospace" 
    font-size="42" 
    font-weight="900" 
    fill="#0E0E0C"
    opacity="0.6"
  >
    {
  </text>
  
  <!-- Secondary text: _developer -->
  <text 
    x="25" 
    y="85" 
    font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="42" 
    font-weight="900" 
    fill="url(#codeGradient)"
    letter-spacing="-0.02em"
  >
    _developer
  </text>
  
  <!-- Closing curly brace -->
  <text 
    x="250" 
    y="85" 
    font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, monospace" 
    font-size="42" 
    font-weight="900" 
    fill="#0E0E0C"
    opacity="0.6"
  >
    }
  </text>
  
  <!-- Code comment indicator -->
  <text 
    x="280" 
    y="45" 
    font-family="monospace" 
    font-size="18" 
    font-weight="400" 
    fill="#0E0E0C"
    opacity="0.4"
    font-style="italic"
  >
    // Software
  </text>
</svg>



