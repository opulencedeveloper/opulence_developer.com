<svg width="450" height="120" viewBox="0 0 450 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeGradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0E0E0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A28;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Function-style with parentheses -->
  <g transform="translate(0, 15)">
    <!-- Function name style -->
    <text 
      x="0" 
      y="45" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="46" 
      font-weight="900" 
      fill="url(#codeGradient3)"
      letter-spacing="-0.02em"
    >
      opulence
    </text>
    
    <!-- Opening parenthesis -->
    <text 
      x="200" 
      y="45" 
      font-family="monospace" 
      font-size="46" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.6"
    >
      (
    </text>
    
    <!-- Parameter: _developer -->
    <text 
      x="220" 
      y="45" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="46" 
      font-weight="900" 
      fill="url(#codeGradient3)"
      letter-spacing="-0.02em"
    >
      _developer
    </text>
    
    <!-- Closing parenthesis -->
    <text 
      x="420" 
      y="45" 
      font-family="monospace" 
      font-size="46" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.6"
    >
      )
    </text>
    
    <!-- Arrow function style for second line -->
    <text 
      x="0" 
      y="90" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="46" 
      font-weight="900" 
      fill="url(#codeGradient3)"
      letter-spacing="-0.02em"
    >
      opulence
    </text>
    
    <!-- Arrow -->
    <text 
      x="200" 
      y="90" 
      font-family="monospace" 
      font-size="40" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.6"
    >
      =&gt;
    </text>
    
    <!-- Return value -->
    <text 
      x="250" 
      y="90" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="46" 
      font-weight="900" 
      fill="url(#codeGradient3)"
      letter-spacing="-0.02em"
    >
      _developer
    </text>
  </g>
  
  <!-- Code comment -->
  <text 
    x="0" 
    y="115" 
    font-family="monospace" 
    font-size="18" 
    font-weight="400" 
    fill="#0E0E0C"
    opacity="0.35"
    font-style="italic"
  >
    // FullStack Software Engineering
  </text>
</svg>



