<svg width="380" height="100" viewBox="0 0 380 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeGradient4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0E0E0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- JSX/Component style -->
  <g transform="translate(0, 10)">
    <!-- Opening JSX tag -->
    <text 
      x="0" 
      y="40" 
      font-family="monospace" 
      font-size="38" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.6"
    >
      &lt;
    </text>
    
    <!-- Main text: opulence -->
    <text 
      x="25" 
      y="40" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="40" 
      font-weight="900" 
      fill="url(#codeGradient4)"
      letter-spacing="-0.02em"
    >
      opulence
    </text>
    
    <!-- Self-closing tag indicator -->
    <text 
      x="200" 
      y="40" 
      font-family="monospace" 
      font-size="38" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.6"
    >
      /&gt;
    </text>
    
    <!-- Opening tag for second line -->
    <text 
      x="0" 
      y="80" 
      font-family="monospace" 
      font-size="38" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.6"
    >
      &lt;
    </text>
    
    <!-- Secondary text: _developer -->
    <text 
      x="25" 
      y="80" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="40" 
      font-weight="900" 
      fill="url(#codeGradient4)"
      letter-spacing="-0.02em"
    >
      _developer
    </text>
    
    <!-- Closing tag -->
    <text 
      x="260" 
      y="80" 
      font-family="monospace" 
      font-size="38" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.6"
    >
      /&gt;
    </text>
  </g>
  
  <!-- Code icon decoration -->
  <g transform="translate(300, 25)">
    <!-- Code brackets icon -->
    <path d="M0 10 L8 20 L0 30" stroke="#0E0E0C" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 10 L12 20 L20 30" stroke="#0E0E0C" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>



