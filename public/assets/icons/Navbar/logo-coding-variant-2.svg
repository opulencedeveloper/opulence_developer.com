<svg width="420" height="110" viewBox="0 0 420 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0E0E0C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Code block style with brackets -->
  <g transform="translate(0, 10)">
    <!-- Opening square bracket -->
    <text 
      x="0" 
      y="40" 
      font-family="monospace" 
      font-size="50" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.5"
    >
      [
    </text>
    
    <!-- Main text: opulence -->
    <text 
      x="30" 
      y="40" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="44" 
      font-weight="900" 
      fill="url(#codeGradient2)"
      letter-spacing="-0.02em"
    >
      opulence
    </text>
    
    <!-- Closing square bracket -->
    <text 
      x="245" 
      y="40" 
      font-family="monospace" 
      font-size="50" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.5"
    >
      ]
    </text>
    
    <!-- Opening square bracket for second line -->
    <text 
      x="0" 
      y="85" 
      font-family="monospace" 
      font-size="50" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.5"
    >
      [
    </text>
    
    <!-- Secondary text: _developer -->
    <text 
      x="30" 
      y="85" 
      font-family="'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="44" 
      font-weight="900" 
      fill="url(#codeGradient2)"
      letter-spacing="-0.02em"
    >
      _developer
    </text>
    
    <!-- Closing square bracket -->
    <text 
      x="280" 
      y="85" 
      font-family="monospace" 
      font-size="50" 
      font-weight="900" 
      fill="#0E0E0C"
      opacity="0.5"
    >
      ]
    </text>
  </g>
  
  <!-- Semicolon at the end -->
  <text 
    x="300" 
    y="85" 
    font-family="monospace" 
    font-size="44" 
    font-weight="900" 
    fill="#0E0E0C"
    opacity="0.6"
  >
    ;
  </text>
  
  <!-- Code line numbers (subtle) -->
  <text 
    x="320" 
    y="40" 
    font-family="monospace" 
    font-size="16" 
    font-weight="400" 
    fill="#0E0E0C"
    opacity="0.3"
  >
    01
  </text>
  <text 
    x="320" 
    y="85" 
    font-family="monospace" 
    font-size="16" 
    font-weight="400" 
    fill="#0E0E0C"
    opacity="0.3"
  >
    02
  </text>
</svg>



